<h1>4.5 Setting Up a Target</h1>
<p>Targets represent Human Machine Interfaces (HMIs) that run user applications downloaded from Vijeo-Designer.</p>
<p>See Section 2.2, <a href="Environment.chm::/supported_target_machines.htm">Supported Tablets, Smartphones, and Target Machines</a> for information on the different types of Target Machines that Vijeo-Designer supports.</p>
