<h2>24.3.1 Enable a Target's Buzzer</h2>
<p>To enable a target's buzzer, follow these steps.</p>
<ol style="list-style: decimal;">
<li class="p">
<p>In the Navigator window, click the Target node to display the Property Inspector.</p>
</li>
</ol>
<ol start="2" style="list-style: decimal;">
<li class="p">
<p>In the Buzzer field, select Enabled.</p>
</li>
</ol>
