<h2>5.8.2 Multiple PLC Connections</h2>
<p>Target machines support multiple PLC connections; however, some drivers cannot run on the same target at the same time.</p>
<p>The following drivers cannot be used together on the same target machine:</p>
<ul>
<li class="p-Bullet">
<p class="Bullet">Siemens MPI/PPI</p>
</li>
<li class="p-Bullet">
<p class="Bullet">Modbus Slave</p>
</li>
<li class="p-Bullet">
<p class="Bullet">Rockwell DH485</p>
</li>
</ul>
