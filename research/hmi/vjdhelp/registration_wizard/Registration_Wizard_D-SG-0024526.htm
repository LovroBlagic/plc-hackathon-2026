        function tail(text,delim) {
          var parts = text.split(delim);
          if (parts.length > 1)
            return parts[parts.length-1];
        }
        function base(text,delim) {
          var mtail = tail(text,delim);
        if (mtail)
        return text.substring(0,text.length - mtail.length - 1);
        else
              return text;
        }
    function childJump(subids) {
      try {
	      var anchor = tail(window.location.href,'#');
	      if (anchor) {
	        var noAnchor = base(window.location.href,'#');
	        var file = tail(noAnchor,'/');
	        var comp = tail(base(file,'.'),'_') + '.';
	        subids = subids.split(';');
	        var i = 0;
	        while (i < subids.length) {
	          var manchor = comp + subids[i];
	          if (manchor == anchor)
	            window.location.href = base(noAnchor,'/') + '/' + base(file,'_') + '_' + manchor + '.' + tail(file,'.');
	          i = i + 1;
	        }
	      }
      } catch (e) { }
      }
