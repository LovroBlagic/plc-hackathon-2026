<p class="Error1">Error 2155: [Recipe] [Recipe Group Name] [Reference Variable] Parison recipe group must have points between 64 and 400.</p>
<p>This error message displays when you choose an integer array with out of range number of elements.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Choose an integer array with 64 to 400 elements. &#160;</p>
</li>
</ul>
