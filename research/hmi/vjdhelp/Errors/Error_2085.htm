<p class="Error1">Error 2085: [Alarms] [BackupAlarmGroup] is not supported by this target type.</p>
<p>Alarm data cannot be backed up on the selected target because there is no storage media, such as a disk or Secondary Drive.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Do not use the feature to backup alarm data with this type of target machine.</p>
</li>
</ul>
