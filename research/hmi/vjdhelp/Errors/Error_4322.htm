<p class="Error1">Error 4322: [Variable] [User Operation] Number of variables exceeds the maximum allowed [%d].</p>
<p>The number of variables set up for a data logging group is more than the maximum allowed for the log user operation.</p>
<h2>Solution:</h2>
<ul>
<li class="p-bullet">
<p class="bullet">Reduce the number of variables for the log user operation.</p>
</li>
</ul>
