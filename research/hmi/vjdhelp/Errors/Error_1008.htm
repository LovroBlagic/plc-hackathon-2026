<p class="Error1">Error 1008: [<span style="font-style: normal;">filename</span>] cannot close file.</p>
<p>The specified file may be corrupted, or in a format that can't be closed.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Save the file with a different filename on your local directory.</p>
</li>
<li class="p-bullet">
<p class="bullet" style="margin-bottom: 0;">If the file is on the network, check if you have read/write access to that directory.</p>
</li>
</ul>
