<p class="Error1">Error 8023: [script type] [script name] [line number] expression type does not match.</p>
<p>The return value could not be assigned to the local script variable.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Make sure expressions on either side of an <a href="Scripts.chm::/Operators.htm#assign">assignment operator</a> are the same data type.</p>
</li>
</ul>
