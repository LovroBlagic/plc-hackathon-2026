<p class="Error1">Warning 2151: [Recipe Group] does not contain any recipes.</p>
<p>This message displays during validation, if a recipe group without recipes is detected. This occurs when you have a recipe group but all the recipes in it have been deleted.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Add one or more recipes to the recipe group.</p>
</li>
</ul>
