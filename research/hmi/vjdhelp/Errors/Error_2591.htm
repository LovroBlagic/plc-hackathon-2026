<p class="Error1">Error 2591: [Target] [Target Name] [Custom Welcome Screen] Only JPEG files can be used as a custom welcome screen.</p>
<p>This error displays when a file that is not in JPEG file format has been selected as the custom welcome screen.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Specify a JPEG file.</p>
</li>
</ul>
