<h1>Error 2622 [Variable][variable name][alarm message] You cannot use reference variables as dynamic content in alarm messages.</h1>
<p>The variable is a reference variable and cannot be used as dynamic content in alarm messages.</p>
<p class="Error2">Solution</p>
<p>Use a different variable.</p>
