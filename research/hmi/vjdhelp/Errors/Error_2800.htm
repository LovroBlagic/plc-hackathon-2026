<p class="Error1">Error 2800: [actions] [event] [trigger event] On Shutdown event is not supported by the current target.</p>
<p>An action has been set to run when the target shuts down; however, the current target does not support this action.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Change the target or change the Trigger Event.</p>
</li>
</ul>
