<h1>Error 2535: [Panel] [<span style="font-style: italic;">panel name</span>] The number of unique placeholders has exceeded the limit of [%d].</h1>
<p>This error message displays when you exceed the maximum number (30) of placeholders allowed on one panel.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Reduce the number of placeholders on the panel.</p>
</li>
</ul>
