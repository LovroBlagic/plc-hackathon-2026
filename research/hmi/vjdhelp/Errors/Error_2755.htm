<p class="Error1">Error 2755: [%s] [%s] [%s] The data grid includes data that doesn’t match the data type of its column variable.</p>
<p>This error message displays because the data grid contains invalid data.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Change the data in the data grid so that it matches the data type of its column variable.</p>
</li>
</ul>
