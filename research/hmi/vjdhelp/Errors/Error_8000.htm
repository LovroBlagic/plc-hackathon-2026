<p>The script has abruptly ended. You probably don't have enough enclosing brackets.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet"><font color="#000000">Match all your opening brackets with a closing bracket, especially for nested expressions.</font></p>
