<p class="Error1">Error 8006: [<span style="font-style: normal;">script type</span>] [<span style="font-style: normal;">script name</span>] [<span style="font-style: normal;">line number</span>] [<span style="font-style: normal;">variable name</span>] is not an array type.</p>
<p>The defined variable is not an array type, but you're trying to use an array address with it.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Remove the array call from the script.</p>
</li>
<li class="p-bullet">
<p class="bullet">Define array dimensions for the variable.</p>
</li>
</ul>
