<p class="Error1">Error 4230: [<span style="font-style: normal;">filename</span>] unable to load file. DLL may be missing.</p>
<p>Vijeo-Designer cannot load a *.dll file for this I/O driver, which may be missing.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Reinstall the I/O driver components and try again. If the problem continues, reinstall the Vijeo-Designer application.</p>
</li>
</ul>
