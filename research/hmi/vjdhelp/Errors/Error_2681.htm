<p class="Error1">Error 2681: &#160;[Target] [target name] [Video] Cannot disable Video when video parts exist in the application.</p>
<p>A video object exists in the target but the target’s Video property is set to Disabled.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Change the target's Video property to NTSC or PAL.</p>
</li>
</ul>
