<p class="Error1">Error 7360: [script name] [line number] Name Conflict.</p>
<p>Names of objects in the editor are also being used as the names of variables in the defined script.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet"><span>This error indicates you've named objects in the editor the same as variables in an associated script.</span></p>
</li>
</ul>
