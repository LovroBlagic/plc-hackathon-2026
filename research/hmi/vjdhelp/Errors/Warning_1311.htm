<p>The CF card is set up to load the user application onto multiple target machines.</p>
<p class="Error2">Solution:</p>
<ul style="list-style: disc;">
<li class="p-bullet">
<p class="bullet">Install the user application onto the main drive when using Multi-Install.</p>
