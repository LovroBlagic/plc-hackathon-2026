<p class="Error1">Error 4329: [object type] [object name] [DeviceAddress] requires an address.</p>
<p>The variable has been assigned to a PLC device but a specific device address has not been defined.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">Enter a device address that is supported by the corresponding PLC.</p>
</li>
</ul>
