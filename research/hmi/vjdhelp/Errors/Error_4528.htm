<h1>Error 4528: [%s] [%s] [%s] The table resource is not defined.</h1>
<p>This error message displays when the State Display in your project is not linked to a table resource.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet">In the State Display properties, select a table resource from the Table Resource property's drop-down list.</p>
</li>
</ul>
