<p class="Error1">Error 8011: [<span style="font-style: normal;">script type</span>] [<span style="font-style: normal;">script name</span>] [<span style="font-style: normal;">line number</span>] one operand of bitwise operator has illegal type.</p>
<p>You can use bitwise operators only on integer variables.</p>
<p class="Error2">Solution:</p>
<ul>
<li class="p-bullet">
<p class="bullet"><span style="font-weight: normal;">Enter integers on both the left and right sides of the bitwise operator.</span></p>
</li>
</ul>
